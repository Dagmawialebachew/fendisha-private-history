    <path d="M-80 112l-12 46M80 112l12 46"/>
    <circle cx="-92" cy="158" r="8" fill="#f3dfff" stroke="none"/><circle cx="92" cy="158" r="8" fill="#f3dfff" stroke="none"/>
  </g>
  <!-- floor rug -->
  <ellipse cx="800" cy="852" rx="405" ry="105" fill="#fff" opacity=".75"/>
  <ellipse cx="800" cy="852" rx="370" ry="86" fill="#d8b1e6" opacity=".18"/>
  <ellipse cx="800" cy="852" rx="300" ry="62" fill="none" stroke="#b983ce" stroke-width="2" opacity=".28"/>
</svg>
