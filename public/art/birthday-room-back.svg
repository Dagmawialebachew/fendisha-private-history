  <g opacity=".8">
    <path d="M95 150c48 100 30 264 70 520 27 52 75 83 128 98-57-244-7-459-40-618z" fill="#d8a9dc" opacity=".36"/>
    <path d="M430 148c-48 120-23 300-76 525-18 45-53 74-100 97 50-246 12-463 43-620z" fill="#f3cce0" opacity=".45"/>
    <path d="M1170 150c50 118 28 293 72 520 21 46 62 76 110 98-54-245-9-460-42-618z" fill="#f0c3df" opacity=".42"/>
    <path d="M1510 147c-47 119-20 295-77 526-19 44-55 73-103 96 52-244 10-463 41-620z" fill="#cfa1dc" opacity=".38"/>
  </g>
  <!-- chandelier -->
  <g transform="translate(800 46)" stroke="#9b6bb6" stroke-width="4" fill="none" opacity=".7">
    <path d="M0 0v72"/>
    <path d="M-105 105c30-42 62-45 105-6 44-39 76-36 105 6"/>
    <path d="M-105 105l-30 48M105 105l30 48M0 99v65"/>
