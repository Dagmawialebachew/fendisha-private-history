<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffafd"/>
      <stop offset="0.52" stop-color="#f7efff"/>
      <stop offset="1" stop-color="#eadcf7"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#f9dff0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#c99be2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b397d"/>
      <stop offset=".5" stop-color="#8e59a8"/>
      <stop offset="1" stop-color="#4d275e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#e8c9f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f6c8dd" stop-opacity=".55"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6b397d" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#light)"/>
  <ellipse cx="800" cy="820" rx="720" ry="190" fill="#b88ad3" opacity=".09" filter="url(#soft)"/>
  <path d="M0 770H1600V1000H0z" fill="#fbf6fd"/>
  <path d="M0 770H1600" stroke="#d8bde8" stroke-width="4" opacity=".45"/>
  <path d="M120 115H1480" stroke="#d9c2e7" stroke-width="3" opacity=".5"/>
  <path d="M90 145H1510" stroke="#fff" stroke-width="2" opacity=".8"/>
  <g opacity=".35" stroke="#b98bcf" fill="none">
    <rect x="90" y="190" width="355" height="505" rx="10"/>
    <rect x="1155" y="190" width="355" height="505" rx="10"/>
    <rect x="480" y="185" width="640" height="510" rx="12"/>
  </g>
  <!-- center arched door -->
  <g>
    <path d="M635 710V390c0-127 73-220 165-220s165 93 165 220v320z" fill="#fdf9ff" stroke="#d7b7e6" stroke-width="9"/>
    <path d="M667 710V399c0-108 58-185 133-185s133 77 133 185v311z" fill="url(#door)"/>
    <path d="M800 217V710" stroke="#d9b5e7" stroke-width="4" opacity=".5"/>
    <path d="M696 420H904M696 545H904" stroke="#f6e8ff" stroke-width="3" opacity=".36"/>
    <circle cx="788" cy="565" r="9" fill="#f8d792"/><circle cx="812" cy="565" r="9" fill="#f8d792"/>
    <path d="M709 350c38-50 75-74 91-74 16 0 53 24 91 74" stroke="#f4deff" stroke-width="5" fill="none" opacity=".28"/>
  </g>
  <!-- tall windows -->
  <g opacity=".9">
    <rect x="170" y="240" width="215" height="400" rx="110" fill="url(#glass)" stroke="#fff" stroke-width="7"/>
    <rect x="1215" y="240" width="215" height="400" rx="110" fill="url(#glass)" stroke="#fff" stroke-width="7"/>
    <path d="M277 247V634M1322 247V634" stroke="#fff" stroke-width="3" opacity=".55"/>
    <path d="M177 445H379M1222 445H1423" stroke="#fff" stroke-width="3" opacity=".55"/>
